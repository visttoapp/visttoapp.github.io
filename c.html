<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https: blob: data:; media-src 'self' https: blob:; connect-src https:; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia do feed · Vistto</title>
<link rel="icon" href="assets/vistto.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260918c"><link rel="stylesheet" href="css/agencies.css?v=20260918c">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="cliente" data-tema="neutro">

<div class="app">
  <aside class="sidebar">
    <div class="agency">
      <div>
        <div class="logo" id="agencyLogo"></div>
        <span class="label" id="agencyTag"></span>
      </div>
    </div>

    <div class="client">
      <span class="eyebrow">Cliente</span>
      <h1 id="clientName"></h1>
      <span class="label month" id="clientMonth"></span>
      <div class="meta" id="clientMeta"></div>
      <select class="months" id="months" aria-label="Mês" hidden></select>
      <div class="summary" id="summary"></div>
    </div>

    <nav class="cal">
      <span class="label">Calendário do mês</span>
      <ul id="calList"></ul>
    </nav>

    <p class="foot" id="foot"></p>
  </aside>

  <main class="main">
    <div class="wrap feed-wrap">
      <header class="head">
        <div class="mark" id="mark"></div>
        <div>
          <span class="eyebrow">Prévia do feed · Aprovação</span>
          <h2 id="title"></h2>
        </div>
      </header>

      <div class="sub">
        <p id="intro"></p>
        <div class="legend" id="legend"></div>
      </div>

      <section class="profile" id="profile"></section>
      <section class="hl" id="hl"></section>
      <section class="feed" id="feed"></section>
      <div class="empty" id="empty" hidden></div>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-label="Post">
  <div class="modal" id="modal"></div>
</div>

<script src="js/config.js?v=20260918c"></script>
<script src="js/brand.js?v=20260918c"></script>
<script src="js/client-api.js?v=20260918c"></script>
<script src="js/app.js?v=20260918c"></script>
</body>
</html>
